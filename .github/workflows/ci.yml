# Phase 7 — GitHub Actions: dbt build + tests on every push
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install dbt-duckdb
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
